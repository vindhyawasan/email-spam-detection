<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spam Email Detector</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 650px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #222;
        }

        .description {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        textarea:focus {
            border-color: #555;
        }

        textarea {
            height: 180px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #222;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        .result {
            margin-top: 25px;
            padding: 15px;
            text-align: center;
            border-radius: 6px;
            background: #f1f1f1;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Spam Email Detector</h1>

        <p class="description">
            Enter an email subject and message to check whether it is spam.
        </p>

        <form method="POST">

            {% csrf_token %}

            <label for="subject">Email Subject</label>

            <input
                type="text"
                id="subject"
                name="subject"
                placeholder="Enter email subject"
                required
            >

            <label for="message">Email Content</label>

            <textarea
                id="message"
                name="message"
                placeholder="Enter email content..."
                required
            ></textarea>

            <button type="submit">
                Check Email
            </button>

        </form>

        {% if result %}

            <div class="result">
                {{ result }}
            </div>

        {% endif %}

    </div>

</body>
</html>
